# Cloudflare Worker that relays the /contact/ form to a Telegram message.
# Secrets (never committed): TURNSTILE_SECRET, TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID, each set with `npx wrangler secret put <NAME>`.
# See ../DEPLOY.md, "Contact form".
name = "contact-form"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
# Origins the site is served from. The github.io one redirects to pjoshi.dev
# since the domain cutover; it stays so a page loaded just before the switch
# can still send.
ALLOWED_ORIGINS = "https://pjoshi.dev,https://firstprateek.github.io"

# Five messages a minute per client IP. Counted per Cloudflare location, which
# is plenty for a personal contact form.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
